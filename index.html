<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SMS Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0b0d10;
      --panel: #11151a;
      --panel-2: #151a20;
      --border: #252b33;
      --text: #f1f3f5;
      --muted: #89929d;
      --green: #35d07f;
      --red: #ff6464;
      --blue: #5c9dff;
      --yellow: #f4c95d;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 1450px;
      margin: auto;
      padding: 24px;
    }

    /* ---------------- HEADER ---------------- */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .api-status {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 13px;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
    }

    .dot.online {
      background: var(--green);
      box-shadow: 0 0 10px rgba(53, 208, 127, .45);
    }

    .dot.offline {
      background: var(--red);
    }

    /* ---------------- LOGIN ---------------- */

    .login {
      max-width: 520px;
      margin: 70px auto;
      padding: 30px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 16px;
    }

    .login h2 {
      margin-top: 0;
    }

    .login p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 13px;
      color: var(--muted);
    }

    input,
    select {
      width: 100%;
      padding: 12px 13px;
      color: var(--text);
      background: #0d1014;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #3c4652;
    }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      background: #f1f3f5;
      color: #101214;
      font-weight: 700;
    }

    .primary:hover {
      opacity: .9;
    }

    .login-error {
      margin-top: 12px;
      color: var(--red);
      font-size: 13px;
    }

    /* ---------------- DASHBOARD ---------------- */

    #dashboard {
      display: none;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .toolbar .search {
      flex: 1;
      min-width: 220px;
    }

    .toolbar button {
      padding: 11px 15px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel);
      color: var(--text);
    }

    .toolbar button:hover {
      background: var(--panel-2);
    }

    /* ---------------- STATS ---------------- */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 13px;
      padding: 17px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: 700;
    }

    /* ---------------- SECTION ---------------- */

    .section {
      margin-bottom: 30px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 13px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .section-header span {
      color: var(--muted);
      font-size: 13px;
    }

    /* ---------------- DEVICES ---------------- */

    .devices {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .device {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 14px;
      padding: 18px;
      transition: border-color .15s ease;
    }

    .device:hover {
      border-color: #39424d;
    }

    .device-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .device-title {
      min-width: 0;
    }

    .device-name {
      font-size: 16px;
      font-weight: 700;
      word-break: break-word;
    }

    .device-manufacturer {
      color: var(--muted);
      margin-top: 4px;
      font-size: 12px;
    }

    .online-badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
    }

    .online-badge.online {
      color: var(--green);
      background: rgba(53, 208, 127, .08);
      border: 1px solid rgba(53, 208, 127, .2);
    }

    .online-badge.offline {
      color: var(--red);
      background: rgba(255, 100, 100, .08);
      border: 1px solid rgba(255, 100, 100, .2);
    }

    .phone {
      margin-top: 15px;
      font-size: 15px;
      font-weight: 600;
    }

    .phone.empty {
      color: var(--muted);
      font-weight: 400;
    }

    .device-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 16px;
    }

    .info {
      background: #0d1014;
      border: 1px solid #20252c;
      border-radius: 9px;
      padding: 10px;
    }

    .info-label {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .info-value {
      margin-top: 4px;
      font-size: 13px;
      word-break: break-word;
    }

    .battery {
      margin-top: 15px;
    }

    .battery-head {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    .battery-track {
      height: 7px;
      border-radius: 999px;
      background: #252b33;
      overflow: hidden;
    }

    .battery-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--green);
      width: 0%;
    }

    .device-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .last-seen {
      color: var(--muted);
      font-size: 11px;
    }

    .delete-device {
      border: 0;
      background: transparent;
      color: var(--red);
      font-size: 12px;
    }

    /* ---------------- SMS ---------------- */

    .messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message-card {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 13px;
      padding: 16px;
    }

    .message-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .sender {
      font-weight: 700;
      font-size: 15px;
    }

    .message-time {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .message-body {
      margin-top: 10px;
      padding: 12px;
      border-radius: 9px;
      background: #0d1014;
      border: 1px solid #20252c;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
      font-size: 14px;
    }

    .message-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-top: 11px;
      color: var(--muted);
      font-size: 11px;
    }

    .message-actions {
      display: flex;
      gap: 7px;
    }

    .small-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 7px;
      padding: 6px 9px;
      font-size: 11px;
    }

    .small-btn:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .small-btn.delete {
      color: var(--red);
    }

    /* ---------------- EMPTY ---------------- */

    .empty {
      border: 1px dashed var(--border);
      border-radius: 13px;
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
    }

    /* ---------------- TOAST ---------------- */

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: 350px;
      padding: 12px 15px;
      border-radius: 10px;
      background: #181d23;
      border: 1px solid var(--border);
      box-shadow: 0 10px 35px rgba(0, 0, 0, .35);
      font-size: 13px;
      display: none;
      z-index: 1000;
    }

    .toast.show {
      display: block;
    }

    .toast.error {
      color: var(--red);
    }

    .toast.success {
      color: var(--green);
    }

    /* ---------------- RESPONSIVE ---------------- */

    @media (max-width: 1100px) {
      .devices {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .stats {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .app {
        padding: 15px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .devices {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .toolbar {
        align-items: stretch;
      }

      .toolbar .search {
        min-width: 100%;
      }

      .message-top {
        flex-direction: column;
        gap: 6px;
      }

      .message-meta {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- LOGIN -->

  <div id="login" class="login">

    <h2>SMS Dashboard</h2>

    <p>
      Enter your administrator token to access
      devices and messages.
    </p>

    <div class="field">

      <label for="token">
        Admin Token
      </label>

      <input
        id="token"
        type="password"
        placeholder="Enter admin token"
        autocomplete="off"
      >

    </div>

    <button
      class="primary"
      onclick="login()"
    >
      Open Dashboard
    </button>

    <div
      id="loginError"
      class="login-error"
    ></div>

  </div>


  <!-- DASHBOARD -->

  <div id="dashboard">

    <header class="header">

      <div class="brand">

        <h1>SMS Dashboard</h1>

        <p>
          Device status and incoming messages
        </p>

      </div>

      <div class="api-status">

        <span
          id="apiDot"
          class="dot"
        ></span>

        <span id="apiText">
          Checking API...
        </span>

      </div>

    </header>


    <!-- TOOLBAR -->

    <div class="toolbar">

      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search device, phone, sender or message..."
        oninput="render()"
      >

      <select
        id="deviceFilter"
        onchange="render()"
      >
        <option value="all">
          All devices
        </option>
      </select>

      <button onclick="refreshAll()">
        ↻ Refresh
      </button>

      <button onclick="logout()">
        Logout
      </button>

    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <div class="stat-label">
          Total Devices
        </div>

        <div
          id="totalDevices"
          class="stat-value"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-label">
          Online
        </div>

        <div
          id="onlineDevices"
          class="stat-value"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-label">
          Offline
        </div>

        <div
          id="offlineDevices"
          class="stat-value"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-label">
          Messages
        </div>

        <div
          id="totalMessages"
          class="stat-value"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-label">
          Last Refresh
        </div>

        <div
          id="lastRefresh"
          class="stat-value"
          style="font-size:15px"
        >
          —
        </div>
      </div>

    </div>


    <!-- DEVICES -->

    <section class="section">

      <div class="section-header">

        <h2>
          Devices
        </h2>

        <span id="deviceCount">
          0 devices
        </span>

      </div>

      <div
        id="devices"
        class="devices"
      ></div>

    </section>


    <!-- MESSAGES -->

    <section class="section">

      <div class="section-header">

        <h2>
          Incoming SMS
        </h2>

        <span id="messageCount">
          0 messages
        </span>

      </div>

      <div
        id="messages"
        class="messages"
      ></div>

    </section>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>

const API =
  "https://smssend-8ek4.onrender.com";


let token =
  sessionStorage.getItem(
    "admin_token"
  ) || "";


let devices = [];
let messages = [];


/* -----------------------------
   HELPERS
----------------------------- */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function formatDate(value) {

  if (!value) {
    return "Never";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "Unknown";
  }

  return date.toLocaleString();
}


function timeAgo(value) {

  if (!value) {
    return "Never";
  }

  const diff =
    Date.now() -
    new Date(value).getTime();

  const seconds =
    Math.max(
      0,
      Math.floor(diff / 1000)
    );


  if (seconds < 60) {
    return `${seconds}s ago`;
  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  if (minutes < 60) {
    return `${minutes}m ago`;
  }


  const hours =
    Math.floor(
      minutes / 60
    );


  if (hours < 24) {
    return `${hours}h ago`;
  }


  return `${Math.floor(hours / 24)}d ago`;
}


function showToast(
  message,
  type = "success"
) {

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.className =
    `toast show ${type}`;

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(() => {

      toast.className =
        "toast";

    }, 3000);
}


/* -----------------------------
   LOGIN
----------------------------- */

async function login() {

  const input =
    document.getElementById(
      "token"
    );

  const error =
    document.getElementById(
      "loginError"
    );

  const value =
    input.value.trim();


  if (!value) {

    error.textContent =
      "Enter admin token.";

    return;
  }


  error.textContent =
    "Checking...";


  try {

    const response =
      await fetch(
        `${API}/api/devices`,
        {
          headers: {
            Authorization:
              `Bearer ${value}`
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        "Invalid admin token."
      );

    }


    token =
      value;


    sessionStorage.setItem(
      "admin_token",
      token
    );


    document.getElementById(
      "login"
    ).style.display =
      "none";


    document.getElementById(
      "dashboard"
    ).style.display =
      "block";


    error.textContent =
      "";


    await refreshAll();


  } catch (err) {

    error.textContent =
      err.message;

  }

}


document
  .getElementById("token")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {
        login();
      }

    }
  );


function logout() {

  sessionStorage.removeItem(
    "admin_token"
  );

  token = "";

  location.reload();
}


/* -----------------------------
   API
----------------------------- */

async function api(
  endpoint,
  options = {}
) {

  const response =
    await fetch(
      `${API}${endpoint}`,
      {
        ...options,

        headers: {
          ...(options.headers || {}),
          Authorization:
            `Bearer ${token}`
        }
      }
    );


  if (
    response.status === 401
  ) {

    logout();

    throw new Error(
      "Session expired."
    );
  }


  let data;

  try {
    data =
      await response.json();
  } catch {
    data = {};
  }


  if (!response.ok) {

    throw new Error(
      data.error ||
      `Request failed (${response.status})`
    );

  }


  return data;
}


/* -----------------------------
   REFRESH
----------------------------- */

async function refreshAll() {

  if (!token) {
    return;
  }


  setApiStatus(
    "Checking...",
    false
  );


  try {

    const results =
      await Promise.all([
        api("/api/devices"),
        api("/api/messages?limit=500")
      ]);


    devices =
      Array.isArray(results[0])
        ? results[0]
        : [];


    messages =
      Array.isArray(results[1])
        ? results[1]
        : [];


    updateDeviceFilter();
    updateStats();
    render();


    setApiStatus(
      "API Online",
      true
    );


    document.getElementById(
      "lastRefresh"
    ).textContent =
      new Date()
        .toLocaleTimeString();

  } catch (err) {

    setApiStatus(
      "API Offline",
      false
    );

    showToast(
      err.message,
      "error"
    );

  }

}


function setApiStatus(
  text,
  online
) {

  document.getElementById(
    "apiText"
  ).textContent =
    text;


  const dot =
    document.getElementById(
      "apiDot"
    );


  dot.className =
    `dot ${
      online
        ? "online"
        : "offline"
    }`;

}


/* -----------------------------
   STATS
----------------------------- */

function updateStats() {

  const online =
    devices.filter(
      device =>
        device.isOnline
    ).length;


  document.getElementById(
    "totalDevices"
  ).textContent =
    devices.length;


  document.getElementById(
    "onlineDevices"
  ).textContent =
    online;


  document.getElementById(
    "offlineDevices"
  ).textContent =
    devices.length -
    online;


  document.getElementById(
    "totalMessages"
  ).textContent =
    messages.length;

}


/* -----------------------------
   DEVICE FILTER
----------------------------- */

function updateDeviceFilter() {

  const select =
    document.getElementById(
      "deviceFilter"
    );


  const current =
    select.value;


  select.innerHTML =
    `<option value="all">
       All devices
     </option>`;


  for (
    const device of devices
  ) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      device.deviceId;


    option.textContent =
      device.phoneNumber
        ? `${device.phoneNumber} — ${device.model || device.deviceId}`
        : (
          device.model ||
          device.deviceId
        );


    select.appendChild(
      option
    );

  }


  if (
    [
      ...select.options
    ].some(
      option =>
        option.value ===
        current
    )
  ) {

    select.value =
      current;

  }

}


/* -----------------------------
   RENDER
----------------------------- */

function render() {

  renderDevices();
  renderMessages();

}


/* -----------------------------
   DEVICE RENDER
----------------------------- */

function renderDevices() {

  const container =
    document.getElementById(
      "devices"
    );


  const search =
    document.getElementById(
      "search"
    )
      .value
      .trim()
      .toLowerCase();


  const filtered =
    devices.filter(
      device => {

        const haystack = [
          device.deviceId,
          device.phoneNumber,
          device.model,
          device.manufacturer,
          device.androidVersion
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        return haystack.includes(
          search
        );

      }
    );


  document.getElementById(
    "deviceCount"
  ).textContent =
    `${filtered.length} device${
      filtered.length === 1
        ? ""
        : "s"
    }`;


  if (!filtered.length) {

    container.innerHTML = `
      <div class="empty">
        No devices found.
      </div>
    `;

    return;
  }


  container.innerHTML =
    filtered
      .map(
        device =>
          deviceCard(device)
      )
      .join("");

}


/* -----------------------------
   DEVICE CARD
----------------------------- */

function deviceCard(device) {

  const battery =
    Number.isFinite(
      Number(
        device.batteryLevel
      )
    )
      ? Math.max(
          0,
          Math.min(
            100,
            Number(
              device.batteryLevel
            )
          )
        )
      : null;


  const status =
    device.isOnline
      ? "online"
      : "offline";


  const phone =
    device.phoneNumber
      ? escapeHtml(
          device.phoneNumber
        )
      : "Phone number not entered";


  return `
    <article class="device">

      <div class="device-top">

        <div class="device-title">

          <div class="device-name">
            ${escapeHtml(
              device.model ||
              "Unknown device"
            )}
          </div>

          <div class="device-manufacturer">
            ${escapeHtml(
              device.manufacturer ||
              "Unknown manufacturer"
            )}
          </div>

        </div>


        <div class="online-badge ${status}">

          <span>
            ${device.isOnline
              ? "●"
              : "●"}
          </span>

          ${
            device.isOnline
              ? "ONLINE"
              : "OFFLINE"
          }

        </div>

      </div>


      <div
        class="phone ${
          device.phoneNumber
            ? ""
            : "empty"
        }"
      >
        ☎ ${phone}
      </div>


      <div class="device-info">

        <div class="info">

          <div class="info-label">
            Android
          </div>

          <div class="info-value">
            ${escapeHtml(
              device.androidVersion ||
              "Unknown"
            )}
          </div>

        </div>


        <div class="info">

          <div class="info-label">
            App Version
          </div>

          <div class="info-value">
            ${escapeHtml(
              device.appVersion ||
              "Unknown"
            )}
          </div>

        </div>


        <div class="info">

          <div class="info-label">
            SMS Count
          </div>

          <div class="info-value">
            ${Number(
              device.smsCount || 0
            )}
          </div>

        </div>


        <div class="info">

          <div class="info-label">
            Charging
          </div>

          <div class="info-value">
            ${
              device.isCharging
                ? "⚡ Yes"
                : "No"
            }
          </div>

        </div>

      </div>


      ${
        battery !== null
          ? `
            <div class="battery">

              <div class="battery-head">

                <span>
                  Battery
                </span>

                <span>
                  ${battery}%
                </span>

              </div>

              <div class="battery-track">

                <div
                  class="battery-fill"
                  style="width:${battery}%"
                ></div>

              </div>

            </div>
          `
          : ""
      }


      <div class="device-footer">

        <div class="last-seen">

          Last seen:
          ${timeAgo(
            device.lastSeen
          )}

          <br>

          ${formatDate(
            device.lastSeen
          )}

        </div>


        <button
          class="delete-device"
          onclick="deleteDevice(
            '${encodeURIComponent(
              device.deviceId
            )}'
          )"
        >
          Delete
        </button>

      </div>

    </article>
  `;
}


/* -----------------------------
   MESSAGE RENDER
----------------------------- */

function renderMessages() {

  const container =
    document.getElementById(
      "messages"
    );


  const search =
    document.getElementById(
      "search"
    )
      .value
      .trim()
      .toLowerCase();


  const selectedDevice =
    document.getElementById(
      "deviceFilter"
    ).value;


  const filtered =
    messages.filter(
      message => {

        if (
          selectedDevice !==
            "all" &&
          message.deviceId !==
            selectedDevice
        ) {
          return false;
        }


        const haystack = [
          message.sender,
          message.message,
          message.deviceId
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();


        return haystack.includes(
          search
        );

      }
    );


  document.getElementById(
    "messageCount"
  ).textContent =
    `${filtered.length} message${
      filtered.length === 1
        ? ""
        : "s"
    }`;


  if (!filtered.length) {

    container.innerHTML = `
      <div class="empty">
        No messages found.
      </div>
    `;

    return;
  }


  container.innerHTML =
    filtered
      .map(
        message =>
          messageCard(message)
      )
      .join("");

}


/* -----------------------------
   MESSAGE CARD
----------------------------- */

function messageCard(message) {

  return `
    <article class="message-card">

      <div class="message-top">

        <div class="sender">
          ${escapeHtml(
            message.sender
          )}
        </div>

        <div class="message-time">
          ${formatDate(
            message.createdAt
          )}
        </div>

      </div>


      <div class="message-body">
        ${escapeHtml(
          message.message
        )}
      </div>


      <div class="message-meta">

        <div>
          Device:
          ${escapeHtml(
            message.deviceId
          )}
        </div>


        <div class="message-actions">

          <button
            class="small-btn"
            onclick="copyMessage(
              '${encodeURIComponent(
                message.message
              )}'
            )"
          >
            Copy
          </button>


          <button
            class="small-btn delete"
            onclick="deleteMessage(
              '${message._id}'
            )"
          >
            Delete
          </button>

        </div>

      </div>

    </article>
  `;
}


/* -----------------------------
   COPY MESSAGE
----------------------------- */

async function copyMessage(
  encoded
) {

  const text =
    decodeURIComponent(
      encoded
    );


  try {

    await navigator
      .clipboard
      .writeText(text);


    showToast(
      "Message copied."
    );

  } catch {

    showToast(
      "Copy failed.",
      "error"
    );

  }

}


/* -----------------------------
   DELETE MESSAGE
----------------------------- */

async function deleteMessage(
  id
) {

  if (
    !confirm(
      "Delete this message?"
    )
  ) {
    return;
  }


  try {

    await api(
      `/api/messages/${encodeURIComponent(id)}`,
      {
        method: "DELETE"
      }
    );


    messages =
      messages.filter(
        message =>
          message._id !== id
      );


    updateStats();
    render();


    showToast(
      "Message deleted."
    );

  } catch (err) {

    showToast(
      err.message,
      "error"
    );

  }

}


/* -----------------------------
   DELETE DEVICE
----------------------------- */

async function deleteDevice(
  encodedId
) {

  const deviceId =
    decodeURIComponent(
      encodedId
    );


  if (
    !confirm(
      "Delete this device?"
    )
  ) {
    return;
  }


  try {

    await api(
      `/api/devices/${encodeURIComponent(deviceId)}`,
      {
        method: "DELETE"
      }
    );


    devices =
      devices.filter(
        device =>
          device.deviceId !==
          deviceId
      );


    messages =
      messages.filter(
        message =>
          message.deviceId !==
          deviceId
      );


    updateDeviceFilter();
    updateStats();
    render();


    showToast(
      "Device deleted."
    );

  } catch (err) {

    showToast(
      err.message,
      "error"
    );

  }

}


/* -----------------------------
   AUTO REFRESH
----------------------------- */

setInterval(
  () => {

    if (
      token &&
      document.getElementById(
        "dashboard"
      ).style.display !==
        "none"
    ) {

      refreshAll();

    }

  },
  30000
);


/* -----------------------------
   AUTO LOGIN
----------------------------- */

if (token) {

  document.getElementById(
    "login"
  ).style.display =
    "none";


  document.getElementById(
    "dashboard"
  ).style.display =
    "block";


  refreshAll();

}

</script>
