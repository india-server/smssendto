<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SMS Dashboard</title>

<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #060812;
    --bg-2: #0a0e1c;
    --panel: rgba(255,255,255,0.045);
    --panel-solid: #0d1120;
    --border: rgba(255,255,255,0.09);
    --border-soft: rgba(255,255,255,0.06);
    --text: #eef1f8;
    --muted: #8890a6;
    --muted-dim: #5c6478;

    --violet: #a78bfa;
    --cyan: #67e8f9;
    --pink: #f472b6;
    --green: #4ade80;
    --red: #fb7185;
    --amber: #fbbf6d;

    --radius: 18px;
    --radius-sm: 12px;
    --font-display: "Poppins", "Segoe UI", sans-serif;
    --font-body: "Inter", "Segoe UI", sans-serif;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  button, input, select { font: inherit; }
  button { cursor: pointer; }
  input, select { -webkit-appearance: none; appearance: none; }

  ::selection { background: rgba(167,139,250,0.35); color: #fff; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }

  /* ---------------- BACKGROUND ATMOSPHERE ---------------- */

  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background:
      radial-gradient(ellipse 90% 60% at 20% -10%, rgba(167,139,250,0.16), transparent 60%),
      radial-gradient(ellipse 70% 50% at 100% 0%, rgba(103,232,249,0.10), transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 120%, rgba(244,114,182,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg-2), var(--bg) 40%);
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0.2;
    animation: twinkle ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.8); }
    50% { opacity: 0.95; transform: scale(1.15); }
  }

  .shooting-star {
    position: absolute;
    top: 8%;
    left: 8%;
    width: 2px;
    height: 2px;
    background: linear-gradient(90deg, #fff, transparent);
    border-radius: 50%;
    filter: drop-shadow(0 0 6px #fff);
    animation: shoot 7s ease-in infinite;
    animation-delay: 2.5s;
  }

  @keyframes shoot {
    0% { transform: translate(0,0) scaleX(1); opacity: 0; }
    2% { opacity: 1; }
    18% { transform: translate(340px, 170px) scaleX(1); opacity: 0; }
    100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .star, .shooting-star { animation: none; }
  }

  /* ---------------- LAYOUT ---------------- */

  .app {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: auto;
    padding: 28px 22px 60px;
  }

  /* ---------------- HEADER ---------------- */

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 14px; }

  .brand-mark {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    background: linear-gradient(145deg, rgba(167,139,250,0.25), rgba(103,232,249,0.15));
    border: 1px solid var(--border);
    box-shadow: 0 0 22px rgba(167,139,250,0.25);
    flex-shrink: 0;
  }

  .brand h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }

  .brand p {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 12.5px;
  }

  .api-status {
    display: flex;
    align-items: center;
    gap: 9px;
    border: 1px solid var(--border);
    background: var(--panel);
    backdrop-filter: blur(14px);
    border-radius: 999px;
    padding: 9px 15px;
    font-size: 12.5px;
    white-space: nowrap;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted-dim);
  }

  .dot.online {
    background: var(--green);
    box-shadow: 0 0 12px rgba(74,222,128,.7);
    animation: pulse-dot 2s ease-in-out infinite;
  }

  .dot.offline { background: var(--red); box-shadow: 0 0 10px rgba(251,113,133,.6); }

  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 6px rgba(74,222,128,.5); }
    50% { box-shadow: 0 0 14px rgba(74,222,128,.9); }
  }

  /* ---------------- LOGIN ---------------- */

  .login {
    position: relative;
    z-index: 1;
    max-width: 400px;
    margin: 10vh auto;
    padding: 34px 28px;
    border: 1px solid var(--border);
    background: var(--panel);
    backdrop-filter: blur(20px);
    border-radius: 22px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  }

  .login-icon {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: linear-gradient(145deg, rgba(167,139,250,0.3), rgba(244,114,182,0.2));
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-bottom: 16px;
    box-shadow: 0 0 26px rgba(167,139,250,0.3);
  }

  .login h2 {
    margin: 0 0 6px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 20px;
    background: linear-gradient(120deg, #fff, var(--violet) 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .login p {
    color: var(--muted);
    line-height: 1.55;
    font-size: 13.5px;
    margin: 0 0 22px;
  }

  .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }

  .field label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  input, select {
    width: 100%;
    padding: 12px 14px;
    color: var(--text);
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  input:focus, select:focus {
    border-color: rgba(167,139,250,0.6);
    box-shadow: 0 0 0 3px rgba(167,139,250,0.15);
  }

  select { cursor: pointer; }

  .primary {
    width: 100%;
    border: 0;
    border-radius: var(--radius-sm);
    padding: 13px 16px;
    background: linear-gradient(120deg, var(--violet), var(--pink));
    color: #12081f;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .2px;
    box-shadow: 0 8px 26px rgba(167,139,250,0.28);
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .primary:hover { transform: translateY(-1px); box-shadow: 0 10px 32px rgba(167,139,250,0.4); }
  .primary:active { transform: translateY(0); }

  .login-error {
    margin-top: 13px;
    color: var(--red);
    font-size: 12.5px;
    min-height: 16px;
  }

  /* ---------------- DASHBOARD ---------------- */

  #dashboard { display: none; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  .toolbar .search { flex: 1; min-width: 220px; }

  .ghost-btn {
    padding: 11px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--panel);
    backdrop-filter: blur(10px);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: background .15s ease, border-color .15s ease;
  }

  .ghost-btn:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.18); }

  /* ---------------- STATS ---------------- */

  .stats {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }

  .stat {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--panel);
    backdrop-filter: blur(14px);
    border-radius: var(--radius);
    padding: 18px;
  }

  .stat::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent, linear-gradient(90deg, var(--violet), var(--cyan)));
  }

  .stat.c-violet::before { background: linear-gradient(90deg, var(--violet), #7c5cf0); }
  .stat.c-green::before  { background: linear-gradient(90deg, var(--green), #22c55e); }
  .stat.c-red::before    { background: linear-gradient(90deg, var(--red), #f43f5e); }
  .stat.c-cyan::before   { background: linear-gradient(90deg, var(--cyan), #38bdf8); }
  .stat.c-pink::before   { background: linear-gradient(90deg, var(--pink), var(--violet)); }

  .stat-label {
    color: var(--muted);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 8px;
  }

  .stat-value {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 600;
  }

  /* ---------------- SECTION ---------------- */

  .section { margin-bottom: 32px; }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .section-header h2 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-header h2::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 2px;
    background: linear-gradient(135deg, var(--violet), var(--pink));
    display: inline-block;
    transform: rotate(45deg);
  }

  .section-header span { color: var(--muted); font-size: 12.5px; }

  /* ---------------- DEVICES ---------------- */

  .devices {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }

  .device {
    position: relative;
    border: 1px solid var(--border);
    background: var(--panel);
    backdrop-filter: blur(14px);
    border-radius: var(--radius);
    padding: 18px;
    transition: border-color .2s ease, transform .2s ease;
  }

  .device:hover {
    border-color: rgba(167,139,250,0.35);
    transform: translateY(-2px);
  }

  .device::after {
    content: "";
    position: absolute;
    left: 0; top: 16px; bottom: 16px;
    width: 3px;
    border-radius: 3px;
    background: var(--muted-dim);
  }

  .device.is-online::after { background: linear-gradient(180deg, var(--green), transparent); }
  .device.is-offline::after { background: linear-gradient(180deg, var(--red), transparent); }

  .device-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .device-title { min-width: 0; }

  .device-name {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    word-break: break-word;
  }

  .device-manufacturer {
    color: var(--muted);
    margin-top: 4px;
    font-size: 11.5px;
  }

  .online-badge {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .3px;
  }

  .online-badge.online {
    color: var(--green);
    background: rgba(74,222,128,.09);
    border: 1px solid rgba(74,222,128,.25);
  }

  .online-badge.offline {
    color: var(--red);
    background: rgba(251,113,133,.09);
    border: 1px solid rgba(251,113,133,.25);
  }

  .phone {
    margin-top: 15px;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: .2px;
  }

  .phone.empty { color: var(--muted); font-weight: 400; }

  .device-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 16px;
  }

  .info {
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 10px 11px;
  }

  .info-label {
    color: var(--muted-dim);
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  .info-value { margin-top: 4px; font-size: 12.5px; word-break: break-word; }

  .battery { margin-top: 15px; }

  .battery-head {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 11.5px;
    margin-bottom: 7px;
  }

  .battery-track {
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
  }

  .battery-fill {
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--green), #86efac);
    width: 0%;
    transition: width .3s ease;
  }

  .battery-fill.low { background: linear-gradient(90deg, var(--red), var(--amber)); }

  .device-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border-soft);
  }

  .last-seen { color: var(--muted-dim); font-size: 10.5px; line-height: 1.5; }

  /* device deletion disabled — locked badge replaces the old delete button */
  .locked-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--muted-dim);
    font-size: 10.5px;
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    padding: 5px 9px;
  }

  /* ---------------- SMS ---------------- */

  .messages { display: flex; flex-direction: column; gap: 10px; }

  .message-card {
    border: 1px solid var(--border);
    background: var(--panel);
    backdrop-filter: blur(14px);
    border-radius: var(--radius);
    padding: 16px 17px;
  }

  .message-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: flex-start;
  }

  .sender {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sender::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    flex-shrink: 0;
  }

  .message-time { color: var(--muted-dim); font-size: 10.5px; white-space: nowrap; }

  .message-body {
    margin-top: 10px;
    padding: 12px 13px;
    border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border-soft);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.55;
    font-size: 13.5px;
  }

  .message-meta {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-top: 11px;
    color: var(--muted-dim);
    font-size: 10.5px;
  }

  .message-actions { display: flex; gap: 7px; }

  .small-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11px;
    transition: background .15s ease, color .15s ease;
  }

  .small-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  .small-btn.delete { color: var(--red); border-color: rgba(251,113,133,0.25); }
  .small-btn.delete:hover { background: rgba(251,113,133,0.08); }

  /* ---------------- EMPTY ---------------- */

  .empty {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
  }

  /* ---------------- TOAST ---------------- */

  .toast {
    position: fixed;
    right: 18px;
    bottom: 18px;
    max-width: 340px;
    padding: 13px 16px;
    border-radius: 13px;
    background: #12162a;
    border: 1px solid var(--border);
    box-shadow: 0 16px 40px rgba(0,0,0,.5);
    font-size: 13px;
    display: none;
    z-index: 1000;
    backdrop-filter: blur(16px);
  }

  .toast.show { display: block; animation: toast-in .25s ease; }
  .toast.error { color: var(--red); border-color: rgba(251,113,133,0.3); }
  .toast.success { color: var(--green); border-color: rgba(74,222,128,0.3); }

  @keyframes toast-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------------- RESPONSIVE ---------------- */

  @media (max-width: 1100px) {
    .devices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 700px) {
    .app { padding: 18px 14px 50px; }
    .header { align-items: flex-start; flex-direction: column; }
    .api-status { align-self: stretch; justify-content: center; }
    .devices { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .toolbar { align-items: stretch; flex-direction: column; }
    .toolbar .search { min-width: 100%; }
    .toolbar button, .toolbar select { width: 100%; justify-content: center; }
    .message-top { flex-direction: column; gap: 6px; }
    .message-meta { align-items: flex-start; flex-direction: column; }
    .login { margin: 6vh 14px; padding: 26px 20px; }
  }

  @media (max-width: 380px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .stat-value { font-size: 20px; }
  }
</style>
</head>

<body>

<div class="sky" id="sky"><div class="shooting-star"></div></div>

<div class="app">

  <!-- LOGIN -->
  <div id="login" class="login">
    <div class="login-icon">🔐</div>
    <h2>SMS Dashboard</h2>
    <p>Enter your administrator token to view connected devices and incoming messages.</p>

    <div class="field">
      <label for="token">Admin Token</label>
      <input id="token" type="password" placeholder="Enter admin token" autocomplete="off">
    </div>

    <button class="primary" onclick="login()">Open Dashboard</button>
    <div id="loginError" class="login-error"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">

    <header class="header">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <h1>SMS Dashboard</h1>
          <p>Device status and incoming messages</p>
        </div>
      </div>

      <div class="api-status">
        <span id="apiDot" class="dot"></span>
        <span id="apiText">Checking API...</span>
      </div>
    </header>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <input id="search" class="search ghost-btn" style="justify-content:flex-start" type="search" placeholder="Search device, phone, sender or message..." oninput="render()">

      <select id="deviceFilter" class="ghost-btn" onchange="render()">
        <option value="all">All devices</option>
      </select>

      <button class="ghost-btn" onclick="refreshAll()">↻ Refresh</button>
      <button class="ghost-btn" onclick="logout()">Logout</button>
    </div>

    <!-- STATS -->
    <div class="stats">
      <div class="stat c-violet">
        <div class="stat-label">Total Devices</div>
        <div id="totalDevices" class="stat-value">0</div>
      </div>
      <div class="stat c-green">
        <div class="stat-label">Online</div>
        <div id="onlineDevices" class="stat-value">0</div>
      </div>
      <div class="stat c-red">
        <div class="stat-label">Offline</div>
        <div id="offlineDevices" class="stat-value">0</div>
      </div>
      <div class="stat c-cyan">
        <div class="stat-label">Messages</div>
        <div id="totalMessages" class="stat-value">0</div>
      </div>
      <div class="stat c-pink">
        <div class="stat-label">Last Refresh</div>
        <div id="lastRefresh" class="stat-value" style="font-size:14.5px">—</div>
      </div>
    </div>

    <!-- DEVICES -->
    <section class="section">
      <div class="section-header">
        <h2>Devices</h2>
        <span id="deviceCount">0 devices</span>
      </div>
      <div id="devices" class="devices"></div>
    </section>

    <!-- MESSAGES -->
    <section class="section">
      <div class="section-header">
        <h2>Incoming SMS</h2>
        <span id="messageCount">0 messages</span>
      </div>
      <div id="messages" class="messages"></div>
    </section>

  </div>
</div>

<div id="toast" class="toast"></div>

<script>

const API = "https://smssend-8ek4.onrender.com";

let token = sessionStorage.getItem("admin_token") || "";
let devices = [];
let messages = [];

/* -----------------------------
   STARFIELD (purely decorative)
----------------------------- */
(function buildSky() {
  const sky = document.getElementById("sky");
  const count = window.innerWidth < 700 ? 55 : 100;

  for (let i = 0; i < count; i++) {
    const star = document.createElement("div");
    star.className = "star";
    const size = Math.random() * 2 + 0.6;
    star.style.width = `${size}px`;
    star.style.height = `${size}px`;
    star.style.top = `${Math.random() * 100}%`;
    star.style.left = `${Math.random() * 100}%`;
    star.style.animationDuration = `${2 + Math.random() * 4}s`;
    star.style.animationDelay = `${Math.random() * 5}s`;
    sky.appendChild(star);
  }
})();

/* -----------------------------
   HELPERS
----------------------------- */

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatDate(value) {
  if (!value) return "Never";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "Unknown";
  return date.toLocaleString();
}

function timeAgo(value) {
  if (!value) return "Never";
  const diff = Date.now() - new Date(value).getTime();
  const seconds = Math.max(0, Math.floor(diff / 1000));
  if (seconds < 60) return `${seconds}s ago`;
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m ago`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}h ago`;
  return `${Math.floor(hours / 24)}d ago`;
}

function showToast(message, type = "success") {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.className = `toast show ${type}`;
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => { toast.className = "toast"; }, 3000);
}

/* -----------------------------
   LOGIN
----------------------------- */

async function login() {
  const input = document.getElementById("token");
  const error = document.getElementById("loginError");
  const value = input.value.trim();

  if (!value) {
    error.textContent = "Enter admin token.";
    return;
  }

  error.textContent = "Checking...";

  try {
    const response = await fetch(`${API}/api/devices`, {
      headers: { Authorization: `Bearer ${value}` }
    });

    if (!response.ok) throw new Error("Invalid admin token.");

    token = value;
    sessionStorage.setItem("admin_token", token);

    document.getElementById("login").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    error.textContent = "";

    await refreshAll();
  } catch (err) {
    error.textContent = err.message;
  }
}

document.getElementById("token").addEventListener("keydown", event => {
  if (event.key === "Enter") login();
});

function logout() {
  sessionStorage.removeItem("admin_token");
  token = "";
  location.reload();
}

/* -----------------------------
   API
----------------------------- */

async function api(endpoint, options = {}) {
  const response = await fetch(`${API}${endpoint}`, {
    ...options,
    headers: {
      ...(options.headers || {}),
      Authorization: `Bearer ${token}`
    }
  });

  if (response.status === 401) {
    logout();
    throw new Error("Session expired.");
  }

  let data;
  try { data = await response.json(); } catch { data = {}; }

  if (!response.ok) {
    throw new Error(data.error || `Request failed (${response.status})`);
  }

  return data;
}

/* -----------------------------
   REFRESH
----------------------------- */

async function refreshAll() {
  if (!token) return;

  setApiStatus("Checking...", false);

  try {
    const results = await Promise.all([
      api("/api/devices"),
      api("/api/messages?limit=500")
    ]);

    devices = Array.isArray(results[0]) ? results[0] : [];
    messages = Array.isArray(results[1]) ? results[1] : [];

    updateDeviceFilter();
    updateStats();
    render();

    setApiStatus("API Online", true);
    document.getElementById("lastRefresh").textContent = new Date().toLocaleTimeString();
  } catch (err) {
    setApiStatus("API Offline", false);
    showToast(err.message, "error");
  }
}

function setApiStatus(text, online) {
  document.getElementById("apiText").textContent = text;
  const dot = document.getElementById("apiDot");
  dot.className = `dot ${online ? "online" : "offline"}`;
}

/* -----------------------------
   STATS
----------------------------- */

function updateStats() {
  const online = devices.filter(device => device.isOnline).length;

  document.getElementById("totalDevices").textContent = devices.length;
  document.getElementById("onlineDevices").textContent = online;
  document.getElementById("offlineDevices").textContent = devices.length - online;
  document.getElementById("totalMessages").textContent = messages.length;
}

/* -----------------------------
   DEVICE FILTER
----------------------------- */

function updateDeviceFilter() {
  const select = document.getElementById("deviceFilter");
  const current = select.value;

  select.innerHTML = `<option value="all">All devices</option>`;

  for (const device of devices) {
    const option = document.createElement("option");
    option.value = device.deviceId;
    option.textContent = device.phoneNumber
      ? `${device.phoneNumber} — ${device.model || device.deviceId}`
      : (device.model || device.deviceId);
    select.appendChild(option);
  }

  if ([...select.options].some(option => option.value === current)) {
    select.value = current;
  }
}

/* -----------------------------
   RENDER
----------------------------- */

function render() {
  renderDevices();
  renderMessages();
}

/* -----------------------------
   DEVICE RENDER
----------------------------- */

function renderDevices() {
  const container = document.getElementById("devices");
  const search = document.getElementById("search").value.trim().toLowerCase();

  const filtered = devices.filter(device => {
    const haystack = [
      device.deviceId,
      device.phoneNumber,
      device.model,
      device.manufacturer,
      device.androidVersion
    ].filter(Boolean).join(" ").toLowerCase();

    return haystack.includes(search);
  });

  document.getElementById("deviceCount").textContent =
    `${filtered.length} device${filtered.length === 1 ? "" : "s"}`;

  if (!filtered.length) {
    container.innerHTML = `<div class="empty">No devices found.</div>`;
    return;
  }

  container.innerHTML = filtered.map(device => deviceCard(device)).join("");
}

/* -----------------------------
   DEVICE CARD
   (delete action removed — device deletion is disabled)
----------------------------- */

function deviceCard(device) {
  const battery = Number.isFinite(Number(device.batteryLevel))
    ? Math.max(0, Math.min(100, Number(device.batteryLevel)))
    : null;

  const status = device.isOnline ? "online" : "offline";

  const phone = device.phoneNumber
    ? escapeHtml(device.phoneNumber)
    : "Phone number not entered";

  return `
    <article class="device is-${status}">

      <div class="device-top">
        <div class="device-title">
          <div class="device-name">${escapeHtml(device.model || "Unknown device")}</div>
          <div class="device-manufacturer">${escapeHtml(device.manufacturer || "Unknown manufacturer")}</div>
        </div>

        <div class="online-badge ${status}">
          ${device.isOnline ? "ONLINE" : "OFFLINE"}
        </div>
      </div>

      <div class="phone ${device.phoneNumber ? "" : "empty"}">☎ ${phone}</div>

      <div class="device-info">
        <div class="info">
          <div class="info-label">Android</div>
          <div class="info-value">${escapeHtml(device.androidVersion || "Unknown")}</div>
        </div>

        <div class="info">
          <div class="info-label">App Version</div>
          <div class="info-value">${escapeHtml(device.appVersion || "Unknown")}</div>
        </div>

        <div class="info">
          <div class="info-label">SMS Count</div>
          <div class="info-value">${Number(device.smsCount || 0)}</div>
        </div>

        <div class="info">
          <div class="info-label">Charging</div>
          <div class="info-value">${device.isCharging ? "⚡ Yes" : "No"}</div>
        </div>
      </div>

      ${battery !== null ? `
        <div class="battery">
          <div class="battery-head">
            <span>Battery</span>
            <span>${battery}%</span>
          </div>
          <div class="battery-track">
            <div class="battery-fill ${battery <= 20 ? "low" : ""}" style="width:${battery}%"></div>
          </div>
        </div>
      ` : ""}

      <div class="device-footer">
        <div class="last-seen">
          Last seen: ${timeAgo(device.lastSeen)}<br>
          ${formatDate(device.lastSeen)}
        </div>

        <span class="locked-tag" title="Device deletion is disabled">🔒 Protected</span>
      </div>

    </article>
  `;
}

/* -----------------------------
   MESSAGE RENDER
----------------------------- */

function renderMessages() {
  const container = document.getElementById("messages");
  const search = document.getElementById("search").value.trim().toLowerCase();
  const selectedDevice = document.getElementById("deviceFilter").value;

  const filtered = messages.filter(message => {
    if (selectedDevice !== "all" && message.deviceId !== selectedDevice) return false;

    const haystack = [message.sender, message.message, message.deviceId]
      .filter(Boolean).join(" ").toLowerCase();

    return haystack.includes(search);
  });

  document.getElementById("messageCount").textContent =
    `${filtered.length} message${filtered.length === 1 ? "" : "s"}`;

  if (!filtered.length) {
    container.innerHTML = `<div class="empty">No messages found.</div>`;
    return;
  }

  container.innerHTML = filtered.map(message => messageCard(message)).join("");
}

/* -----------------------------
   MESSAGE CARD
----------------------------- */

function messageCard(message) {
  return `
    <article class="message-card">
      <div class="message-top">
        <div class="sender">${escapeHtml(message.sender)}</div>
        <div class="message-time">${formatDate(message.createdAt)}</div>
      </div>

      <div class="message-body">${escapeHtml(message.message)}</div>

      <div class="message-meta">
        <div>Device: ${escapeHtml(message.deviceId)}</div>

        <div class="message-actions">
          <button class="small-btn" onclick="copyMessage('${encodeURIComponent(message.message)}')">Copy</button>
          <button class="small-btn delete" onclick="deleteMessage('${message._id}')">Delete</button>
        </div>
      </div>
    </article>
  `;
}

/* -----------------------------
   COPY MESSAGE
----------------------------- */

async function copyMessage(encoded) {
  const text = decodeURIComponent(encoded);
  try {
    await navigator.clipboard.writeText(text);
    showToast("Message copied.");
  } catch {
    showToast("Copy failed.", "error");
  }
}

/* -----------------------------
   DELETE MESSAGE
----------------------------- */

async function deleteMessage(id) {
  if (!confirm("Delete this message?")) return;

  try {
    await api(`/api/messages/${encodeURIComponent(id)}`, { method: "DELETE" });

    messages = messages.filter(message => message._id !== id);

    updateStats();
    render();
    showToast("Message deleted.");
  } catch (err) {
    showToast(err.message, "error");
  }
}

/* -----------------------------
   AUTO REFRESH
----------------------------- */

setInterval(() => {
  if (token && document.getElementById("dashboard").style.display !== "none") {
    refreshAll();
  }
}, 30000);

/* -----------------------------
   AUTO LOGIN
----------------------------- */

if (token) {
  document.getElementById("login").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  refreshAll();
}

</script>

</body>
</html>
